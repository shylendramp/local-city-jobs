<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="appGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- App Icon Base Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#appGradient)" filter="url(#subtleShadow)"/>
  
  <!-- Briefcase Handle -->
  <path d="M 204 186 L 204 148 C 204 130 218 116 236 116 L 276 116 C 294 116 308 130 308 148 L 308 186" 
        fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round"/>
        
  <!-- Briefcase Main Body -->
  <rect x="116" y="186" width="280" height="200" rx="28" ry="28" fill="#FFFFFF"/>
  
  <!-- Accent Line / Divider -->
  <path d="M 116 266 L 396 266" stroke="#DBEAFE" stroke-width="8"/>
  
  <!-- Central Badge / Lock -->
  <rect x="236" y="246" width="40" height="40" rx="10" ry="10" fill="#1D4ED8"/>
  <circle cx="256" cy="264" r="5" fill="#FFFFFF"/>
